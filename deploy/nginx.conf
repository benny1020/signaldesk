events { worker_connections 1024; }
http {
  upstream signaldesk_api {
    least_conn;
    server api-a:4319 max_fails=2 fail_timeout=5s;
    server api-b:4319 max_fails=2 fail_timeout=5s;
    keepalive 32;
  }
  server {
    listen 8080;
    client_max_body_size 1m;
    location / {
      proxy_pass http://signaldesk_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      # GET/read retries only; never automatically replay POST/PATCH mutations.
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
