name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t signaldesk:ci .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Authenticated container and restart acceptance
        run: node scripts/container-smoke.mjs signaldesk:ci
      - name: Shared PostgreSQL and four-process acceptance
        run: node scripts/postgres-smoke.mjs signaldesk:ci
